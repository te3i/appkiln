<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">AppKiln five-skill design pipeline</title>
  <desc id="desc">A vertical pipeline connecting five design skills from visual direction to final interaction polish.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d12"/><stop offset="1" stop-color="#18251c"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7f36b"/><stop offset="1" stop-color="#7ee787"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="780" rx="28" fill="url(#bg)"/>
  <text x="70" y="74" fill="#f6f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">The five-skill design pipeline</text>
  <text x="70" y="112" fill="#aab3c5" font-family="Inter,Arial,sans-serif" font-size="19">Each stage owns one decision layer and hands a contract to the next.</text>
  <path d="M135 182v484" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(190 150)"><rect width="870" height="90" rx="18" fill="#121722" stroke="#3a4b39"/><circle cx="-55" cy="45" r="29" fill="#b7f36b"/><text x="-65" y="53" fill="#11170c" font-size="24" font-weight="800">1</text><text x="28" y="36" fill="#b7f36b" font-size="16" font-weight="800">VISUAL STRATEGY</text><text x="28" y="66" fill="#f6f7fb" font-size="22" font-weight="700">Flutter Design Taste → Visual Direction</text></g>
    <g transform="translate(190 270)"><rect width="870" height="90" rx="18" fill="#121722" stroke="#3a4b39"/><circle cx="-55" cy="45" r="29" fill="#b7f36b"/><text x="-65" y="53" fill="#11170c" font-size="24" font-weight="800">2</text><text x="28" y="36" fill="#b7f36b" font-size="16" font-weight="800">EXPERIENCE ARCHITECTURE</text><text x="28" y="66" fill="#f6f7fb" font-size="22" font-weight="700">Mobile UI/UX Pro Max → Screen Specifications</text></g>
    <g transform="translate(190 390)"><rect width="870" height="90" rx="18" fill="#121722" stroke="#3a4b39"/><circle cx="-55" cy="45" r="29" fill="#b7f36b"/><text x="-65" y="53" fill="#11170c" font-size="24" font-weight="800">3</text><text x="28" y="36" fill="#b7f36b" font-size="16" font-weight="800">DESIGN-SYSTEM ENGINEERING</text><text x="28" y="66" fill="#f6f7fb" font-size="22" font-weight="700">Custom Design System → Tokens + Components</text></g>
    <g transform="translate(190 510)"><rect width="870" height="90" rx="18" fill="#121722" stroke="#3a4b39"/><circle cx="-55" cy="45" r="29" fill="#b7f36b"/><text x="-65" y="53" fill="#11170c" font-size="24" font-weight="800">4</text><text x="28" y="36" fill="#b7f36b" font-size="16" font-weight="800">QUALITY AUDIT</text><text x="28" y="66" fill="#f6f7fb" font-size="22" font-weight="700">Improve Design → Evidence-based fixes</text></g>
    <g transform="translate(190 630)"><rect width="870" height="90" rx="18" fill="#b7f36b"/><circle cx="-55" cy="45" r="29" fill="#b7f36b"/><text x="-65" y="53" fill="#11170c" font-size="24" font-weight="800">5</text><text x="28" y="36" fill="#355226" font-size="16" font-weight="800">INTERACTION POLISH</text><text x="28" y="66" fill="#11170c" font-size="22" font-weight="800">thienqo → Responsive behavior + final polish</text></g>
  </g>
</svg>
