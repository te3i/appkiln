    <text x="100" y="34" fill="#f6f7fb" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800">APPKILN</text>
    <text x="100" y="67" fill="#aab3c5" font-family="Inter,Arial,sans-serif" font-size="18">Universal mobile app build skill</text>
  </g>
  <text x="92" y="270" fill="#f6f7fb" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Idea → Design → Build → Ship</text>
  <text x="96" y="330" fill="#aab3c5" font-family="Inter,Arial,sans-serif" font-size="25">Five connected design skills. One precise delivery workflow.</text>
