<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AppKiln Universal Mobile Build Skill</title>
  <desc id="desc">A dark green AppKiln banner showing the journey from app idea to verified APK or IPA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b10"/><stop offset="1" stop-color="#18251c"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7f36b" stop-opacity=".95"/><stop offset="1" stop-color="#7ee787" stop-opacity=".7"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1330" cy="-30" r="300" fill="#b7f36b" opacity=".13" filter="url(#blur)"/>
  <circle cx="130" cy="650" r="260" fill="#7ee787" opacity=".08" filter="url(#blur)"/>
  <path d="M78 470 C330 380 430 520 650 420 S1010 270 1515 345" fill="none" stroke="#b7f36b" stroke-opacity=".18" stroke-width="2"/>
