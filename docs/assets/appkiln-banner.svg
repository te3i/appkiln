    <g transform="translate(450 418)"><circle r="15" fill="#b7f36b"/><text x="32" y="7" fill="#f6f7fb">UX architecture</text></g>
    <g transform="translate(750 418)"><circle r="15" fill="#b7f36b"/><text x="32" y="7" fill="#f6f7fb">Design system</text></g>
    <g transform="translate(1040 418)"><circle r="15" fill="#b7f36b"/><text x="32" y="7" fill="#f6f7fb">Audit + polish</text></g>
  </g>
  <text x="96" y="554" fill="#b7f36b" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800">Flutter · Swift · Android APK · iOS IPA · GitHub Actions</text>
